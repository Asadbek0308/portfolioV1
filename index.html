  <!-- Primary SEO Meta Tags -->

  <meta name="title" content="Asadbek | Creative Developer & UI/UX Specialist" />
  <meta name="description" content="Portfolio of Asadbek, a creative frontend developer specializing in interactive web experiences, custom animations, and modern user interfaces." />

  <!-- Open Graph / social previews -->
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <!-- TODO: add og:url, og:image and <link rel="canonical"> once the domain is final -->

  <!-- Apply the saved theme before first paint so there is no light-mode flash -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Fonts Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Varela+Round&display=swap"
